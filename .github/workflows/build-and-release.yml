name: Build & Release Crossamp (0.x series)

on:
  # Ejecutar manualmente desde la pestaña Actions
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version to release (e.g. v0.1.0). Leave empty to auto-increment.'
        required: false
        default: ''
      prerelease:
        description: 'Prerelease tag (true/false)'
        required: false
        default: 'false'

  # Ejecutar en pushes a las ramas principales
  push:
    branches: [dev, crossamp]

jobs:
  build-and-release:
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write

    steps:
      # === 1. Checkout ===
      - name: 📂 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # === 2. Setup Node.js ===
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # === 3. Instalar dependencias ===
      - name: 📦 Install dependencies
        run: npm ci

      # === 4. Type check ===
      - name: ✅ Type check
        run: npm run typecheck

      # === 5. Build Electron app (Vite) ===
      - name: ⚙️ Build Electron app
        run: npm run build
        env:
          VITE_SKIP_PREFLIGHT_CHECK: '1'

      # === 6. Verify artifacts exist in dist/ ===
      - name: 📋 Check existing artifacts
        id: check_artifacts
        run: |
          echo "📦 Verifying existing builds in dist/..."
          APP_EXISTS=[ -d dist/crossamp-darwin-arm64/crossamp.app ] && echo "APP_FOUND=true" || echo "APP_FOUND=false"
          EXE_EXISTS=[ -f dist/crossamp-win32-x64/crossamp.exe ] && echo "EXE_FOUND=true" || echo "EXE_FOUND=false"
          echo "app_found=$APP_EXISTS" >> $GITHUB_OUTPUT
          echo "exe_found=$EXE_EXISTS" >> $GITHUB_OUTPUT

      # === 7. Create GitHub Release ===
      - name: 🏷️ Determine release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag_selected=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
            echo "Using provided tag: ${{ github.event.inputs.tag }}"
          else
            CURRENT_VER=$(node -p "require('./package.json').version")
            CLEAN_VER=$(echo "$CURRENT_VER" | sed 's/^v//')
            MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1)
            MINOR=$(echo "$CLEAN_VER" | cut -d. -f2)
            PATCH=$(echo "$CLEAN_VER" | cut -d. -f3)
            NEW_PATCH=$((PATCH + 1))
            NEW_VER="${MAJOR}.${MINOR}.${NEW_PATCH}"
            SELECTED_TAG="v${NEW_VER}"
            echo "tag_selected=${SELECTED_TAG}" >> $GITHUB_OUTPUT
            echo "Auto-incremented version: $CURRENT_VER → $SELECTED_TAG"
          fi

      - name: 🏷️ Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.tag.outputs.tag_selected }}"
          name: "Crossamp v${{ steps.tag.outputs.tag_selected }} – Gapless Player"
          body: |
            ## Crossamp Release

            **Gapless playback** • **MP3 tags editor (Alt+3)** • **Media keys** • **Bento UI** • **Multiplatform**

            ### What's new
            - Auto-generated release from GitHub Actions (0.x series)

            ### Downloads
            - **macOS (.app)**: `%{app_url}`
            - **Windows (.exe)**: `%{exe_url}`

            ---
            *Auto-generated release • [View on GitHub](https://github.com/dbarrerap/crossamp)*

          prerelease: ${{ github.event.inputs.prerelease == 'true' }}

      # === 8. Upload macOS .app asset if it exists ===
      - name: 📎 Upload macOS app asset (if available)
        if: steps.check_artifacts.outputs.app_found == 'true'
        run: |
          APP_PATH="dist/crossamp-darwin-arm64/crossamp.app"
          echo "📤 Uploading .app from $APP_PATH..."
          curl -L \
            -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/${{ steps.create_release.outputs.release_id }}/assets?name=crossamp-darwin-arm64.app \
            --data-binary @"$APP_PATH"
            echo "✅ .app uploaded"

      # === 9. Upload Windows .exe asset if it exists ===
      - name: 📎 Upload Windows exe asset (if available)
        if: steps.check_artifacts.outputs.exe_found == 'true'
        run: |
          EXE_PATH="dist/crossamp-win32-x64/crossamp.exe"
          echo "📤 Uploading .exe from $EXE_PATH..."
          curl -L \
            -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/releases/${{ steps.create_release.outputs.release_id }}/assets?name=crossamp-win32-x64.exe \
            --data-binary @"$EXE_PATH"
            echo "✅ .exe uploaded"

      # === 10. Download links for email ===
      - name: 📧 Download links for email
        run: |
          echo "=== Download links for email ==="
          
          if [ "${{ steps.check_artifacts.outputs.app_found }}" == "true" ]; then
            echo "macOS: https://github.com/dbarrerap/crossamp/releases/latest/download/crossamp-darwin-arm64.app"
          else
            echo "macOS: .app no disponible en dist/ (compila localmente con: node scripts/package.mjs darwin arm64)"
          fi
          
          if [ "${{ steps.check_artifacts.outputs.exe_found }}" == "true" ]; then
            echo "Windows: https://github.com/dbarrerap/crossamp/releases/latest/download/crossamp-win32-x64.exe"
          else
            echo "Windows: .exe no disponible en dist/ (compila localmente con: node scripts/package.mjs win32 x64)"
          fi
          
          echo "📄 Release URL: https://github.com/dbarrerap/crossamp/releases/tag/${{ steps.tag.outputs.tag_selected }}"
          echo "📋 Versión release: ${{ steps.tag.outputs.tag_selected }}"
          echo "📋 Copia estos links para incluirlos en tus emails a clientes/colaboradores."